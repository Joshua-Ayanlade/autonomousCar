ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true          # ground robot: ignores z, roll, pitch
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom         # odom-only fusion, no GPS/map source

    # Order: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  true, false]
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true